name: ⭐ Layout request
description: Add new DialPad layout
title: '[Layout Request] Layout Name'
labels: ['enhancement', 'dialpad layout']
assignees:
  - sinu0
body:
  - type: markdown
    attributes:
      value: |
        Please make sure to [test existing layouts](https://github.com/sinu0/asus-linux-dialpad/tree/master/layouts) before filing this issue!

  - type: input
    attributes:
      label: Layout Name
      placeholder: Layout Name

  - type: input
    attributes:
      label: Your device (cat /sys/devices/virtual/dmi/id/product_name)
      placeholder: Your device

  - type: input
    attributes:
      label: Supported Devices
      description: List all devices that have the same layout as the one you request. If you know of no else leave empty.
      placeholder: ex. Asus Rog Scar 5, Asus Rog Scar 6

  - type: textarea
    attributes:
      label: DialPad Layout (photo/picture or code)
      description: Attach a picture of the layout (just take a picture of how the DialPad layout on the touchpad looks). You can see examples in the Layouts section in the README.
    validations:
      required: true

  - type: input
    attributes:
      label: Top offset [If exists]

  - type: input
    attributes:
      label: Right offset [If exists]

  - type: input
    attributes:
      label: Bottom offset [If exists]

  - type: input
    attributes:
      label: Left offset [If exists]

  - type: input
    attributes:
      label: Top left icon data (width, height)

  - type: input
    attributes:
      label: Top right icon data (width, height)

  - type: textarea
    attributes:
      label: Additional Info

  - type: checkboxes
    attributes:
      label: Acknowledgements
      options:
        - label: This layout doesn't currently exist and I have read the [Layout section](https://github.com/sinu0/asus-linux-dialpad#layouts)
          required: true
